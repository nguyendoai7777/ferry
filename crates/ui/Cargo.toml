[package]
name = "ferry-ui"
description = "Cửa sổ `ferry-ui` (GPUI + materiant): chỉ vẽ trạng thái nhận qua IPC và gửi lệnh — không mạng, không kho khoá"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ferry-ui"
path = "src/main.rs"

[dependencies]
ferry-core.workspace = true
# Release note cho hộp "Có gì mới" (ferry-gd2_01); cửa sổ không gọi mạng, chỉ dùng `updater::notes`.
updater.workspace = true
# GPUI đi qua materiant (`materiant::gpui_kit`), không ghim gpui-kit lần hai (D-6).
materiant.workspace = true
# Ctrl+Shift+I / Ctrl+Shift+C ở bản debug (D-19, D-25); bản release crate rỗng.
devtool.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Ngày sửa theo múi giờ máy (đã có trong cây qua GPUI).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Nút cửa sổ + kéo cửa sổ trên Windows (`platform`, bê từ Groovex).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Đèn giao thông (cỡ nút để căn giữa thanh trên) + bảng Giới thiệu của AppKit + icon Dock bản dev (`platform/macos.rs`). MIT / Apache-2.0, đã có
# trong cây qua GPUI và `ferry`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSString"] }

[lints]
workspace = true

[build-dependencies]
# Icon của exe Windows (`build.rs`); nền khác không gọi.
embed-resource = "3"
