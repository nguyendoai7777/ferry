[package]
name = "ferry-daemon"
description = "Tiến trình nền `ferry`: khay, IPC, bật cửa sổ `ferry-ui`, chạy hàng đợi — không GPU, không framework UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ferry"
path = "src/main.rs"

[dependencies]
ferry-core.workspace = true
interprocess.workspace = true
log.workspace = true
futures.workspace = true
# Thông báo hệ thống khi cả lô xong / cần làm gì (PROTOCOL 2.6). Linux nói D-Bus qua `zbus` thuần Rust (feature `z`
# mặc định, không `libdbus`), Windows toast WinRT, macOS `mac-notification-sys`. MIT/Apache, soát `cargo deny` (gd1_07).
notify-rust = "4"
# Runtime của engine: 2 luồng (discovery + runner mỗi điện thoại), hẹn giờ, kênh.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# Linux không dùng `tray-icon` (đòi GTK + libappindicator): khay StatusNotifierItem tự viết như fastcast, `platform/linux/sni.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
# `async-io`, không `tokio`: cùng bản đã có trong cây qua `keyring` (Secret Service).
zbus = { version = "5", default-features = false, features = ["async-io"] }
# Clipboard danh sách tệp (Cắt / Sao chép sang máy tính, W-10): tự làm chủ selection X11 / XWayland để đưa cả
# `x-special/gnome-copied-files` (cắt) — `arboard` chỉ có `text/uri-list`. MIT/Apache, thuần Rust.
x11rb = { version = "0.13", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
# `CF_HDROP` + `Preferred DropEffect` (W-10). BSL-1.0.
clipboard-win = "5.4"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSBundle", "NSString"] }
# URL tệp trên NSPasteboard (W-10). MIT/Apache; không bật ảnh.
arboard = { version = "3.7", default-features = false }

[dev-dependencies]
# Điện thoại giả `ferry-core/tests/fake_phone` (gộp bằng `#[path]` vào test của engine) cần hai crate này.
percent-encoding = "2"
serde_json.workspace = true
tempfile = "3"
uuid = { version = "1", default-features = false, features = ["std", "v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }

[lints]
workspace = true
