[package]
name = "ferry-core"
description = "Lõi ferry: giao thức, hàng đợi, cấu hình, i18n, IPC — không UI, không GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dirs = "6"
# `clientName` mặc định (PROTOCOL 6.3): tên máy. Apache-2.0.
gethostname = "1"
# Interface của PC (subnet, prefix /64, tên ⇄ index cho link-local) — thứ tự địa chỉ PROTOCOL 6.2. MIT/BSD-3.
if-addrs = "0.15"
interprocess.workspace = true
# Token trong kho khoá OS (`pairing`, PROTOCOL 2.2): Keychain macOS, Credential Manager Windows, Secret Service Linux qua
# `zbus` thuần Rust (không `libdbus`) + mã hoá phiên `crypto-rust`. MIT/Apache, cả cây đã soát `cargo deny` (gd1_06).
keyring = "4.2"
log.workspace = true
# Dò `_vpsync._tcp` (PROTOCOL 6.2): một luồng riêng, không runtime async; A + AAAA kèm interface nhận. MIT/Apache.
mdns-sd = "0.21"
# Mã hoá tên tệp / thư mục trong header (PROTOCOL 6.1, 6.9). MIT/Apache.
percent-encoding = "2"
# Client HTTP v1 (PROTOCOL 6): không TLS, không HTTP/2, không proxy hệ thống; `stream` cho thân PATCH đọc dần từ đĩa. MIT/Apache.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# Hàng đợi bền (`queue::store`). MIT; SQLite biên dịch kèm (public domain), không phụ thuộc thư viện hệ thống.
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
# Runner upload (`transfer`, gd1_04) + happy eyeballs (`discovery`, gd1_05): đọc tệp nguồn, `watch` / `mpsc`, đồng hồ backoff + nhịp tiến độ, `select!`.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
# `ReaderStream`: thân PATCH đọc từng khúc nhỏ từ tệp, không đọc cả khúc 32 MB vào RAM. MIT.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# `clientId` (PROTOCOL 6.3): UUID v4 từ nguồn ngẫu nhiên của OS.
uuid = { version = "1", default-features = false, features = ["std", "v4"] }

[target.'cfg(windows)'.dependencies]
# DACL của pipe, soát exe của server (`ipc.rs`). Đã có trong cây qua `interprocess`.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
# Server giả `tests/fake_phone` (TCP thô) + test async.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
